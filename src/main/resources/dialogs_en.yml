# ================================
# PROLOGUE — "Awakening"
# ================================

messenger.spawn:
  hologram: true
  actionBar: true
  title: false
  effect: "DARKNESS"
  lines:
    - delay: 0
      text: "&7&o*The world around suddenly darkens...*"
      sound: "AMBIENT_CAVE"
    - delay: 5
      text: "&d&o???&r: &7...is someone there?"
      sound: "ENTITY_ENDERMAN_STARE"
    - delay: 10
      text: "&7&o*A figure materializes from the mist*"
      sound: "ENTITY_ENDERMAN_TELEPORT"
      removeEffect: true
    - delay: 15
      text: "&6Messenger: &7Finally... You have arrived."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 21
      text: "&6Messenger: &7My name is the Messenger. I've been waiting for you."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 27
      text: "&6Messenger: &7The world is dying. Portals are crumbling, boundaries between worlds are thinning."
      sound: "BLOCK_GLASS_BREAK"
    - delay: 35
      text: "&6Messenger: &aBut you can stop this."
      sound: "ENTITY_VILLAGER_YES"
    - delay: 41
      text: "&6Messenger: &7To the north lies an ancient altar. The Stabilization Core is hidden there."
      sound: "BLOCK_BELL_USE"
    - delay: 49
      text: "&6Messenger: &7Only it can restore the balance..."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 55
      text: "&6Messenger: &dSeek ruins with purple glow. Go... before it's too late."
      sound: "BLOCK_BEACON_AMBIENT"
    - delay: 63
      text: "&7&o*The Messenger vanishes into the mist*"
      sound: "ENTITY_ENDERMAN_TELEPORT"
    - delay: 68
      text: "&e&l✦ &eNew Quest:&f Find the Ruined Portal to the north"
      sound: "UI_TOAST_CHALLENGE_COMPLETE"

