name: ServerStoryPlugin
version: '${project.version}'
main: com.mmmm.story.MmmmStoryPlugin
api-version: '1.21'
author: Rethinger
description: Story campaign plugin for Minecraft by Rethinger
website: https://pidoras.uno

commands:
  story:
    description: Main story plugin command
    usage: /story <start|menu|give|debug|refresh>
    permission: story.admin
    aliases: [st]
  server:
    description: Server start command
    usage: /server start
    permission: story.admin
    aliases: [srv]
  testtexture:
    description: Test texture system
    usage: /testtexture
    permission: story.admin

permissions:
  story.admin:
    description: Full admin access to story plugin
    default: op
  story.debug:
    description: Debug and teleport commands
    default: op
  story.progress.view:
    description: View story progress
    default: true
