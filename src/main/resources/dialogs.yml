# ================================
# ПРОЛОГ — "Пробуждение"
# ================================

# Messenger spawns and introduces the quest
messenger.spawn:
  hologram: true
  actionBar: true
  title: false
  effect: "DARKNESS"
  disappearanceLine: 63
  lines:
    - delay: 0
      text: "&7&o*Мир вокруг внезапно темнеет...*"
      sound: "AMBIENT_CAVE"
    - delay: 5
      text: "&d&o???&r: &7...кто-то здесь есть?"
      sound: "ENTITY_ENDERMAN_STARE"
    - delay: 10
      text: "&7&o*Фигура материализуется из тумана*"
      sound: "ENTITY_ENDERMAN_TELEPORT"
      removeEffect: true
    - delay: 15
      text: "&6Посланник: &7Наконец-то... Вы прибыли."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 21
      text: "&6Посланник: &7Меня зовут Посланник. Я ждал вас."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 27
      text: "&6Посланник: &7Мир умирает. Порталы рушатся, границы между мирами истончаются."
      sound: "BLOCK_GLASS_BREAK"
    - delay: 35
      text: "&6Посланник: &aНо вы можете это остановить."
      sound: "ENTITY_VILLAGER_YES"
    - delay: 41
      text: "&6Посланник: &7На севере лежит древний алтарь. Ядро Стабилизации спрятано там."
      sound: "BLOCK_BELL_USE"
    - delay: 49
      text: "&6Посланник: &7Только оно может восстановить баланс..."
      sound: "ENTITY_VILLAGER_AMBIENT"
    - delay: 55
      text: "&6Посланник: &dИщите руины с фиолетовым свечением. Идите... пока не поздно."
      sound: "BLOCK_BEACON_AMBIENT"
    - delay: 63
      text: "&7&o*Посланник исчезает в тумане*"
      sound: "ENTITY_ENDERMAN_TELEPORT"
    - delay: 68
      text: "&e&l✦ &eНовый квест:&f Найдите Разрушенный Портал на севере"
      sound: "UI_TOAST_CHALLENGE_COMPLETE"

